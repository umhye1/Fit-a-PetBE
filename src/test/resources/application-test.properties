spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.cloud.aws.s3.enabled=false
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.s3.bucket=test
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
jwt.secret=integration-test-only-64-byte-secret-must-never-be-used-in-production-12345
jwt.access-token-expiration=60000
jwt.refresh-token-expiration=300000
jwt.issuer=fit-a-pet
jwt.audience=fit-a-pet-api
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
